# 开发环境配置 - 使用内存数据库快速启动
server:
  port: 8084

spring:
  application:
    name: memorin-statistics-service
  
  # H2内存数据库配置
  datasource:
    url: jdbc:h2:mem:memorin_statistics;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  # H2控制台配置
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false
  
  # Redis配置（开发环境简化）
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    database: 4
  
  # JSON配置
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false  # 开发环境暂时禁用Redis健康检查
    db:
      enabled: true

# 微服务调用配置
services:
  user-service:
    base-url: http://localhost:8081
    timeout: 5000
  knowledge-service:
    base-url: http://localhost:8082
    timeout: 5000
  review-service:
    base-url: http://localhost:8083
    timeout: 5000

# 统计服务配置（开发环境）
memorin:
  statistics:
    # 缓存配置（开发环境缩短时间）
    cache:
      overview-ttl: 300   # 概览统计缓存5分钟
      trend-ttl: 600      # 趋势分析缓存10分钟
      knowledge-ttl: 300  # 知识点统计缓存5分钟
      recommendation-ttl: 900  # 推荐缓存15分钟
    
    # 计算配置
    calculation:
      default-analysis-days: 7   # 开发环境默认7天
      max-analysis-days: 30      # 开发环境最大30天
      batch-size: 100            # 小批处理
      thread-pool-size: 2        # 小线程池
    
    # 预警配置
    alert:
      forgetting-risk-threshold: 0.6      # 更低的阈值便于测试
      learning-stagnation-days: 3         # 更短的天数便于测试
      mistake-accumulation-threshold: 5    # 更低的阈值便于测试
      efficiency-decline-threshold: 0.2    # 更低的阈值便于测试

# 日志配置
logging:
  level:
    com.memorin.statistics: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.data.redis: DEBUG
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n" 