# Memorin复习管理服务 - 主配置文件
# 提供SM-2算法、复习会话管理、错题管理等功能

# 服务配置
server:
  port: 8083
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Spring配置
spring:
  application:
    name: memorin-review-service
  
  # Nacos服务发现配置
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: memorin-dev
        group: DEFAULT_GROUP
        metadata:
          version: 1.0.0
          region: default
          service-type: review-management
          description: "Memorin复习管理服务 - SM-2算法、复习会话、错题管理"
  
  # 数据源配置 - MySQL开发数据库
  datasource:
    url: jdbc:mysql://localhost:3306/memorin_review?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    # H2控制台配置
    h2:
      console:
        enabled: true
        path: /h2-console
        settings:
          trace: false
          web-allow-others: false

  # JPA配置
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: UTC

  # 数据源初始化
  sql:
    init:
      mode: always
      continue-on-error: true

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    defaults:
      enabled: true

# JWT配置
jwt:
  secret: memorin_review_service_secret_key_2025_very_long_and_secure
  expiration: 86400000  # 24小时，单位毫秒

# 日志配置
logging:
  level:
    com.memorin.review: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/memorin-review-service.log
    max-size: 100MB
    max-history: 30

# 复习算法配置
review:
  algorithm:
    # SM-2算法参数
    sm2:
      min-ease-factor: 1.3
      max-ease-factor: 3.0
      error-penalty: 0.3
      vague-penalty: 0.1
      correct-reward: 0.15
      error-review-delay-hours: 6
    
    # 批量处理限制
    batch:
      max-size: 100  # 单次批量处理最大数量
      
    # 掌握度评估参数
    mastery:
      accuracy-weight: 0.7      # 准确率权重
      ease-factor-weight: 0.3   # 易度因子权重

# 业务配置
business:
  # 复习会话配置
  session:
    max-duration-minutes: 120    # 最大会话时长(分钟)
    auto-save-interval-minutes: 5 # 自动保存间隔(分钟)
    
  # 错题管理配置
  mistake:
    max-reasons: 10              # 错误原因最大数量
    auto-resolve-threshold: 0.8  # 自动解决阈值(正确率)

# 开发环境标识
environment: development 