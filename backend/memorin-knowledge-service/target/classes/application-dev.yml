# Memorin知识管理服务 - 开发环境配置
# 专门用于开发调试，使用H2内存数据库快速启动

server:
  port: 8082

spring:
  application:
    name: memorin-knowledge-service
  
  # Nacos服务发现配置 - 开发环境禁用
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: localhost:8848
        namespace: memorin-dev
        group: DEFAULT_GROUP
        metadata:
          version: 1.0.0
          region: default
          service-type: knowledge-management
          description: "Memorin知识库管理服务"
  
  # MySQL数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/memorin_knowledge?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # 移除H2控制台配置
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false

  # Redis配置 - 开发环境（保留配置但标记为可选）
  redis:
    host: localhost
    port: 6379
    password: memorin_2025
    database: 2
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 10
        max-idle: 8
        min-idle: 2
        max-wait: 2000ms
    # 开发环境Redis连接失败时不阻塞应用启动
    jedis:
      pool:
        enabled: false

  # JSON配置
  jackson:
    default-property-inclusion: NON_NULL
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# 监控配置 - 开发环境
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false  # 开发环境禁用Redis健康检查
    db:
      enabled: true

# 日志配置 - 开发环境更详细
logging:
  level:
    com.memorin.knowledge: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.data.redis: WARN  # 降低Redis日志级别
    redis.clients.jedis: WARN
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 知识管理服务配置（开发环境）
memorin:
  knowledge:
    # 数据导入配置
    import:
      batch-size: 100
      max-file-size: 10MB
    
    # 缓存配置（开发环境缩短时间）
    cache:
      category-ttl: 300      # 分类缓存5分钟
      knowledge-ttl: 600     # 知识点缓存10分钟
    
    # 搜索配置
    search:
      max-results: 100
      highlight-enabled: true 