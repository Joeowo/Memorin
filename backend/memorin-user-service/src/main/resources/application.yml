# Memorin用户服务配置文件
# 配置服务端口、数据库、Redis、JWT等核心功能
server:
  port: 8081
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: memorin-user-service
  
  # Nacos服务发现配置
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: memorin-dev
        group: DEFAULT_GROUP
        metadata:
          version: 1.0.0
          region: default
          service-type: user-management
          description: "Memorin用户认证授权服务"
  
  # 数据库配置 - MySQL 8.0
  datasource:
    url: jdbc:mysql://localhost:3306/memorin_user?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: memorin_user
    password: memorin_2025
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: MemorinUserPool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  # Redis配置
  redis:
    host: localhost
    port: 6379
    password: memorin_2025
    database: 1
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 10
        max-idle: 8
        min-idle: 2
        max-wait: 2000ms

  # JSON配置
  jackson:
    default-property-inclusion: NON_NULL
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# JWT配置
jwt:
  secret: MemorinJwtSecretKey2025!@#$%^&*()
  expiration: 86400000  # 24小时 (毫秒)
  refresh-expiration: 604800000  # 7天 (毫秒)
  header: Authorization
  prefix: Bearer 

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    db:
      enabled: true

# 日志配置
logging:
  level:
    com.memorin.user: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/memorin-user-service.log
    max-size: 100MB
    max-history: 30

# 应用配置
memorin:
  user:
    # 密码策略
    password:
      min-length: 8
      max-length: 50
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special: false
    
    # 登录策略
    login:
      max-attempts: 5
      lock-duration: 300000  # 5分钟锁定时间(毫秒)
      session-timeout: 1800000  # 30分钟会话超时(毫秒)
    
    # 注册策略
    register:
      email-verification: true
      auto-activation: false
      default-role: USER
    
    # 缓存配置
    cache:
      user-info-ttl: 1800  # 用户信息缓存30分钟
      login-attempt-ttl: 300  # 登录尝试缓存5分钟
      token-blacklist-ttl: 86400  # 令牌黑名单缓存24小时

# 分页配置
spring.data.web.pageable:
  default-page-size: 20
  max-page-size: 100
  one-indexed-parameters: false
  page-parameter: page
  size-parameter: size

# 文件上传配置
spring.servlet.multipart:
  enabled: true
  max-file-size: 10MB
  max-request-size: 50MB
  file-size-threshold: 2KB 