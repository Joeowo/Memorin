# 开发环境配置 - 使用内存数据库快速启动
server:
  port: 8081

spring:
  application:
    name: memorin-user-service
  
  # 禁用Nacos服务发现（开发环境）
  cloud:
    nacos:
      discovery:
        enabled: false
  
  # MySQL数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/memorin_user?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # 移除H2控制台配置
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false
  
  # 禁用Redis（暂时）
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
  
  # JSON配置
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# JWT配置
jwt:
  secret: MemorinDevJwtSecretKey2025!@#$%^&*()
  expiration: 86400000  # 24小时
  refresh-expiration: 604800000  # 7天
  header: Authorization
  prefix: Bearer 

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false  # 暂时禁用Redis健康检查
    db:
      enabled: true

# 日志配置
logging:
  level:
    com.memorin.user: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n" 